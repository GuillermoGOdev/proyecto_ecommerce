<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">E-commerce Admin</span>
            <div class="nav-links">
                <a href="index.html" class="active">Productos</a>
                <a href="historial.html">Historial de Stock</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1>Gestión de Productos</h1>
        <div class="filtros-seccion">
            <div class="filter-container" id="categorias-filtros">
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="buscador" placeholder="Buscar por nombre o categoría..." onkeyup="filtrarProductos()">
        </div>

        <div class="precio-filtro-container">
            <label for="precioRange">Precio máximo: <span id="precioMaxLabel">S/9000</span></label>
            <input type="range" id="precioRange" min="0" max="9000" step="50" value="9000" oninput="filtrarProductos()">
        </div>

        <div id="contenedor-productos"></div>

        <div class="admin-actions">
    <button class="btn-principal" onclick="abrirModal()">+ Agregar Nuevo Producto</button>
</div>

    <div id="modalProducto" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2>Detalles del Producto</h2>
            <div class="form-container-modal">
                <input type="text" id="nombre" placeholder="Nombre del producto">
            <div class="row">
                <input type="number" id="precio" placeholder="Precio (S/)">
                <select id="categoria">
                    <option value="">Categoría</option>
                </select>
            </div>
                <input type="text" id="imagenURL" placeholder="URL de la imagen">
                <button class="btn-guardar" onclick="agregarProducto()">Guardar en Catálogo</button>
            </div>
        </div>
    </div>
    </main>
    
    <script src="js/app.js"></script>
</body>
</html>
