<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="carrito-top">

    <a href="carrito.html" class="btn-carrito">

        🛒 Carrito

        <span id="contador-carrito">0</span>

    </a>

</div>
    <h1>Productos</h1>
    <div class="search-container">
        <input type="text" id="buscador" placeholder="Buscar por nombre o categoría..." onkeyup="filtrarProductos()">
    </div>

    <div id="contenedor-productos"></div>

    <h2>Agregar Producto</h2>
        <div class="form-container">
            <input type="text" id="nombre" placeholder="Nombre">
            <input type="number" id="precio" placeholder="Precio">
            <input type="text" id="imagenURL" placeholder="URL de la imagen (https://...)">

            <select id="categoria">
                <option value="">Seleccione una categoría</option>
            </select>

            <button onclick="agregarProducto()">Guardar Producto</button>
        </div>
    
    <script src="js/app.js"></script>
</body>
</html>
