<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Historial de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <span class="logo" style="display: flex; align-items: center; gap: 8px;">UTP E-commerce</span>
            <div class="nav-links" style="display: flex; align-items: center; gap: 15px;">
                <a href="index.html">Gestionar Productos</a>
                <a href="historial.html" id="nav-historial" class="active">Historial de Stock</a>

                <!-- Selector de Rol (Sin emojis) -->
                <div class="rol-selector-container"
                    style="display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 6px;">
                    <label for="rol-select" style="color: white; font-weight: bold; font-size: 0.9rem;">Rol:</label>
                    <select id="rol-select" onchange="cambiarRolDeSesion(this.value)"
                        style="padding: 4px 8px; border-radius: 4px; border: none; font-weight: bold; background: #fff; cursor: pointer; font-size: 0.85rem; color: #333;">
                        <option value="CLIENTE">Comprador (Cliente)</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1>Panel de Control E-commerce</h1>

        <section class="table-section">
            <h2>Kardex de Movimientos</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Producto</th>
                            <th>Operación</th>
                            <th>Cantidad</th>
                            <th>Motivo/Obs.</th>
                        </tr>
                    </thead>
                    <tbody id="lista-historial">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/historial.js"></script>
</body>

</html>
