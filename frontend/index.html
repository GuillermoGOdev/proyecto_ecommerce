<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <span class="logo" style="display: flex; align-items: center; gap: 8px;">UTP E-commerce</span>
            <div class="nav-links" style="display: flex; align-items: center; gap: 15px;">
                <a href="index.html" class="active">Productos</a>
                <a href="historial.html" id="nav-historial">Historial de Stock</a>
                
                <!-- Selector de Rol (Sin emojis) -->
                <div class="rol-selector-container" style="display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px;">
                    <label for="rol-select" style="color: white; font-weight: bold; font-size: 0.9rem;">Rol:</label>
                    <select id="rol-select" onchange="cambiarRolDeSesion(this.value)" style="padding: 4px 8px; border-radius: 4px; border: none; font-weight: bold; background: #fff; cursor: pointer; font-size: 0.85rem;">
                        <option value="CLIENTE">Comprador (Cliente)</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1>Gestión de Productos</h1>
        <div class="filtros-seccion">
            <div class="filter-container" id="categorias-filtros">
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="buscador" placeholder="Buscar por nombre o categoría..." onkeyup="filtrarProductos()">
        </div>

        <div class="precio-filtro-container">
            <label for="precioRange">Precio máximo: <span id="precioMaxLabel">S/9000</span></label>
            <input type="range" id="precioRange" min="0" max="9000" step="50" value="9000" oninput="filtrarProductos()">
        </div>

        <section class="strategy-card">

    <div class="strategy-info">

        <h2>💳 Simulador de Descuentos</h2>

        <p>
            Selecciona el tipo de cliente y descubre el precio final
            utilizando el <strong>Patrón Strategy</strong>.
        </p>

    </div>

    <div class="strategy-controls">

        <select id="tipoCliente">

            <option value="normal">Cliente Normal</option>
            <option value="premium">Cliente Premium (10%)</option>
            <option value="vip">Cliente VIP (20%)</option>
            <option value="black">Black Friday (30%)</option>

        </select>

        <button onclick="calcularDescuento()">

            Aplicar Descuento

        </button>
        <div id="resultadoDescuento"></div>

    </div>
</section>

        <div id="contenedor-productos"></div>

        <div class="admin-actions">
    <button class="btn-principal" onclick="abrirModal()">+ Agregar Nuevo Producto</button>
</div>

    <div id="modalProducto" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2>Detalles del Producto</h2>
            <div class="form-container-modal">
                <input type="text" id="nombre" placeholder="Nombre del producto">
            <div class="row">
                <input type="number" id="precio" placeholder="Precio (S/)">
                <select id="categoria">
                    <option value="">Categoría</option>
                </select>
            </div>
                <input type="text" id="imagenURL" placeholder="URL de la imagen">
                <button class="btn-guardar" onclick="agregarProducto()">Guardar en Catálogo</button>
            </div>
        </div>
    </div>
    </main>
    
    <script src="js/app.js"></script>
</body>
</html>
